<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5ff;
            margin: 0;
            padding: 25px;
        }

        .chat-container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px #d5dced;
        }

        .chat-header {
            background: #3159cf;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #chat-box {
            height: 320px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            overflow-wrap: anywhere;
        }

        .user {
            background: #e0e9ff;
            text-align: right;
        }

        .bot {
            background: #eeeeee;
            text-align: left;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 15px;
        }

        #question {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #bbbbbb;
            border-radius: 8px;
        }

        button {
            background: #3159cf;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #203fa0;
        }

        .back-link {
            display: block;
            text-align: center;
            padding: 15px;
            color: #3159cf;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>🎓 AI College Helpdesk</h2>
            <p>Ask your college-related questions</p>
        </div>

        <div id="chat-box" aria-live="polite">
            <div class="message bot">
                Hello! 👋 How can I help you today?
                Try asking about BCA, admissions, exams or library.
            </div>
        </div>

        <form class="input-area" id="chat-form">
            <input
                type="text"
                id="question"
                placeholder="Type your question..."
                aria-label="Your question"
                required
            >
            <button type="submit" id="send-btn">Send</button>
        </form>

        <a class="back-link" href="/">← Back to Home</a>
    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("question");
        const chatBox = document.getElementById("chat-box");
        const sendButton = document.getElementById("send-btn");

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = "message " + type;
            message.textContent = text;
            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const question = input.value.trim();
            if (!question) return;

            addMessage("You: " + question, "user");
            input.value = "";
            sendButton.disabled = true;

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.answer || "Request failed");
                }

                addMessage("Bot: " + data.answer, "bot");
            } catch (error) {
                addMessage(
                    "Sorry, something went wrong. Please try again.",
                    "bot"
                );
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
